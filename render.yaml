# Final academic-demo target: Vercel Hobby + Render Free + existing Azure DB.
# Preparation only; deployment/firewall/Git publication require approval.
# Existing schema/knowledge are initialized: no migration or ingestion startup step.
services:
  - type: web
    name: prepmate-api
    branch: feature/phase5-saas-redesign
    runtime: docker
    plan: free
    numInstances: 1
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: "off"
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: STAGING_ENABLED
        value: "true"
      - key: STAGING_ACCESS_MODE
        value: public
      - key: STAGING_REGISTRATION_ENABLED
        value: "true"
      - key: AI_ENABLED
        value: "false"
      - key: SPEECH_ENABLED
        value: "false"
      - key: AI_GLOBAL_CONCURRENCY
        value: "1"
      - key: STAGING_AI_USER_DAILY_LIMIT
        value: "30"
      - key: STAGING_AI_GLOBAL_DAILY_LIMIT
        value: "100"
      - key: FORWARDED_ALLOW_IPS
        value: ""
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: LLM_PROVIDER
        value: azure_openai
      # Provider credentials are deliberately omitted while AI/Speech are off.
      # Add backend-only values after hosting/provider verification, not at build.
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_TIMEOUT
        value: "10"
      - key: DB_CONNECT_TIMEOUT
        value: "10"
